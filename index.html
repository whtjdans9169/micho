<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E9E6B">
  <title>micho 스터디 플래너</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#2E9E6B', dark: '#23805A', soft: '#E3F4EA' } },
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/ko.global.min.js"></script>
  <style>
    body { font-family: Pretendard, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .fc { --fc-border-color: #f1f1f1; --fc-today-bg-color: #E3F4EA; font-size: 12px; }
    .fc .fc-toolbar-title { font-size: 18px; font-weight: 700; }
    .fc .fc-button, .fc .fc-button-primary { background: #fff; border: 1px solid #e5e7eb; color: #374151; box-shadow: none !important; }
    .fc .fc-button-primary:not(:disabled):hover, .fc .fc-button-primary:disabled { background: #f3f4f6; color: #111827; border-color: #e5e7eb; }
    .fc .fc-daygrid-day-number, .fc .fc-col-header-cell-cushion { color: #374151; text-decoration: none; }
    .fc .fc-event { border-radius: 4px; padding: 0 2px; font-size: 11px; cursor: pointer; }
    .fc .fc-daygrid-day { cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-white relative"></div>
  <div id="modal"></div>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
