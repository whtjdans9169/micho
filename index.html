<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#E9F6EE">
  <title>정림24 건축사 스터디앱</title>
  <!-- 홈 화면에 추가했을 때 앱처럼 열리도록 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="동기들과스터디">
  <meta name="application-name" content="동기들과스터디">
  <!-- 홈 화면 앱에서 배경이 상태바(시간 · 배터리 줄) 뒤까지 이어지게 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#1F9D66', dark: '#12724A', soft: '#E3F4EA' } },
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <script>
    // 다크 모드를 화면이 그려지기 전에 먼저 적용 (깜빡임 방지)
    try {
      const mode = localStorage.getItem('micho:theme') || 'system';
      if (mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch {}
  </script>
  <style>
    /* 앱처럼 쓰도록 두 손가락 확대 · 두 번 탭 확대를 막는다 */
    html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Pretendard, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      color: #10261B;
      background: #E9F6EE;
      min-height: 100vh;
    }
    /* 배경: 초록 계열 메쉬 그라데이션 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(40rem 40rem at 5% -5%, rgba(52, 199, 138, .45), transparent 60%),
        radial-gradient(34rem 34rem at 105% 5%, rgba(125, 211, 252, .35), transparent 60%),
        radial-gradient(40rem 40rem at 60% 115%, rgba(163, 230, 53, .28), transparent 60%),
        linear-gradient(180deg, #F3FBF6, #E1F2E8);
    }

    /* 리퀴드 글라스 */
    .glass {
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: 0 12px 32px -14px rgba(15, 107, 69, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
    }
    .glass-strong {
      background: rgba(255, 255, 255, .82);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 24px 60px -20px rgba(15, 107, 69, .35);
    }
    /* 초록 그라데이션 유리 (메인 카드) */
    .glass-hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #3ED296 0%, #1F9D66 55%, #0F6B45 100%);
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: 0 24px 48px -18px rgba(15, 107, 69, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
    }
    .glass-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(90% 70% at 0% 0%, rgba(255, 255, 255, .35), transparent 55%),
        radial-gradient(60% 60% at 100% 100%, rgba(163, 230, 53, .25), transparent 60%);
    }
    .glass-hero > * { position: relative; }
    /* 초록 카드 위의 작은 유리 */
    .chip {
      background: rgba(255, 255, 255, .18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
    }
    .btn {
      color: #fff;
      background: linear-gradient(135deg, #3ED296, #1F9D66 60%, #12724A);
      box-shadow: 0 10px 22px -10px rgba(31, 157, 102, .8), inset 0 1px 0 rgba(255, 255, 255, .45);
    }
    .btn:disabled { opacity: .6; }
    .field {
      background: rgba(255, 255, 255, .65);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: inset 0 1px 2px rgba(15, 107, 69, .08);
    }
    /* 과목 재생 버튼: 유리구슬 느낌 */
    .orb {
      background-image: linear-gradient(145deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 55%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 8px 18px -6px var(--c);
      transition: box-shadow .2s;
    }
    .orb.on { box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 0 0 6px color-mix(in srgb, var(--c) 28%, transparent), 0 8px 18px -6px var(--c); }

    /* 배경은 상태바 뒤까지, 내용은 상태바 아래부터 (일반 브라우저에서는 여백 0) */
    body { padding-top: env(safe-area-inset-top); }

    /* 하단 탭 (아이폰 홈 바와 겹치지 않게) · 사이드바는 상태바 아래부터 */
    .nav { bottom: max(1rem, env(safe-area-inset-bottom)); }
    @media (min-width: 768px) { .nav { bottom: 1rem; top: calc(1rem + env(safe-area-inset-top)) !important; } }

    /* ---------- 다크 모드 (html.dark) ---------- */
    html.dark { color-scheme: dark; }
    html.dark body { color: #E4F1E9; background: #0B1A13; }
    html.dark body::before {
      background:
        radial-gradient(40rem 40rem at 5% -5%, rgba(31, 157, 102, .35), transparent 60%),
        radial-gradient(34rem 34rem at 105% 5%, rgba(56, 130, 170, .22), transparent 60%),
        radial-gradient(40rem 40rem at 60% 115%, rgba(101, 163, 13, .18), transparent 60%),
        linear-gradient(180deg, #0E2018, #08140F);
    }
    html.dark .glass { background: rgba(28, 48, 38, .55); border-color: rgba(255, 255, 255, .08); box-shadow: 0 12px 32px -14px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06); }
    html.dark .glass-strong { background: rgba(20, 36, 28, .92); border-color: rgba(255, 255, 255, .08); }
    html.dark .glass-hero { background: linear-gradient(135deg, #2BAF7A 0%, #17804F 55%, #0B5236 100%); border-color: rgba(255, 255, 255, .15); }
    html.dark .field { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .1); color: #E4F1E9; }
    html.dark .field::placeholder { color: #6E8479; }
    html.dark .text-gray-300 { color: #3F5248; }
    html.dark .text-gray-400 { color: #72877C; }
    html.dark .text-gray-500 { color: #8FA398; }
    html.dark .text-gray-600 { color: #A9BAB1; }
    html.dark .text-gray-700 { color: #C4D2CA; }
    html.dark .text-brand { color: #4FD69E; }
    html.dark .text-brand-dark { color: #7BE3B6; }
    html.dark .bg-white { background-color: #1E3A2D; }
    html.dark .bg-white\/30, html.dark .bg-white\/40 { background-color: rgba(255, 255, 255, .04); }
    html.dark .bg-white\/50, html.dark .bg-white\/60 { background-color: rgba(255, 255, 255, .06); }
    html.dark .bg-white\/70, html.dark .bg-white\/75 { background-color: rgba(255, 255, 255, .08); }
    html.dark .bg-white\/80, html.dark .bg-white\/85 { background-color: rgba(255, 255, 255, .11); }
    html.dark .hover\:bg-white\/40:hover, html.dark .hover\:bg-white\/50:hover, html.dark .hover\:bg-white\/60:hover { background-color: rgba(255, 255, 255, .08); }
    html.dark .bg-gray-900 { background-color: #E4F1E9; color: #0B1A13; }
    html.dark .divide-white\/70 > * + * { border-color: rgba(255, 255, 255, .08); }
    html.dark .border-white\/80 { border-color: rgba(255, 255, 255, .1); }
    html.dark .border-gray-300 { border-color: rgba(255, 255, 255, .25); }
    html.dark .hover\:bg-red-50:hover { background-color: rgba(239, 68, 68, .15); }
    html.dark .bg-pink-100 { background-color: rgba(244, 114, 182, .18); }

    /* 꾹 눌러서 순서 바꾸기 (D-Day 목록) */
    .sortable li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .sort-chosen { transform: scale(1.03); box-shadow: 0 14px 30px -10px rgba(15, 107, 69, .45) !important; }
    .sort-ghost { opacity: .35; }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 10px; }
  </style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <div id="modal"></div>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
